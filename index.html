<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe Online</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0b0e14;
            --card: #151921;
            --accent: #38bdf8;
            --text: #f1f5f9;
            --border: #2d333b;
        }
        body {
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card);
            padding: 2.5rem;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.4);
            text-align: center;
            width: 320px;
            border: 1px solid var(--border);
        }
        h2 { margin-top: 0; font-weight: 600; letter-spacing: -0.5px; }
        input {
            width: 100%;
            padding: 14px;
            margin: 15px 0;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: #0b0e14;
            color: white;
            text-align: center;
            box-sizing: border-box;
            font-size: 1rem;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        .btn {
            background: var(--accent);
            color: #0b0e14;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            cursor: pointer;
            width: 100%;
            font-size: 0.95rem;
            transition: all 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: translateY(-1px); }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 25px;
            display: none;
        }
        .cell {
            aspect-ratio: 1/1;
            background: #1c212b;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.2rem;
            font-weight: 800;
            cursor: pointer;
            transition: 0.15s;
            border: 1px solid var(--border);
        }
        .cell:hover { background: #242c38; }
        #status {
            margin-bottom: 10px;
            font-size: 0.9rem;
            font-weight: 500;
            color: #94a3b8;
            min-height: 20px;
        }
        .hidden { display: none; }
        .X { color: #f472b6; text-shadow: 0 0 15px rgba(244, 114, 182, 0.3); }
        .O { color: var(--accent); text-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body>

<div class="container">
    <h2>Tic-Tac-Toe</h2>
    
    <div id="lobby">
        <input type="text" id="room-id" placeholder="Номер комнаты">
        <button class="btn" onclick="joinRoom()">ИГРАТЬ</button>
    </div>

    <div id="game-area" class="hidden">
        <div id="status">Подключение...</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <button class="btn" style="margin-top: 25px; background: #21262d; color: #c9d1d9;" onclick="location.reload()">ВЫЙТИ</button>
    </div>
</div>

<script>
    const firebaseConfig = {
        databaseURL: "https://my-xo-game-21c3b-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let roomId, mySymbol, currentTurn, board = Array(9).fill("");
    let gameActive = false;

    function joinRoom() {
        const input = document.getElementById('room-id').value.trim();
        if(!input) return;
        roomId = input;
        
        const ref = db.ref('rooms/' + roomId);
        
        ref.once('value').then(snap => {
            const data = snap.val();
            if(!data) {
                mySymbol = 'X';
                ref.set({ board: board, turn: 'X', winner: null });
            } else {
                mySymbol = 'O';
            }
            
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('board').style.display = 'grid';
            gameActive = true;
            listenForMoves();
        });
    }

    function listenForMoves() {
        db.ref('rooms/' + roomId).on('value', snap => {
            const data = snap.val();
            if(!data) return;

            board = data.board;
            currentTurn = data.turn;
            const winner = data.winner;
            
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => {
                cells[i].innerText = val;
                cells[i].className = 'cell ' + (val ? val : '');
            });

            const statusEl = document.getElementById('status');
            if(winner) {
                statusEl.innerText = winner === 'Draw' ? "НИЧЬЯ" : "ПОБЕДА: " + winner;
                gameActive = false;
            } else {
                statusEl.innerText = (currentTurn === mySymbol) ? "ВАШ ХОД ("+mySymbol+")" : "ОЖИДАНИЕ ХОДА...";
            }
        });
    }

    function makeMove(i) {
        if(!gameActive || board[i] !== "" || currentTurn !== mySymbol) return;
        board[i] = mySymbol;
        const winner = checkWin(board) ? mySymbol : (board.includes("") ? null : 'Draw');
        db.ref('rooms/' + roomId).update({
            board: board,
            turn: mySymbol === 'X' ? 'O' : 'X',
            winner: winner
        });
    }

    function checkWin(b) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return lines.some(l => b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]);
    }
</script>
</body>
</html>
