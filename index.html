<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XO Online - Firebase Edition</title>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
    <style>
        :root {
            --bg: #0f172a;
            --card: #1e293b;
            --accent: #38bdf8;
            --text: #f1f5f9;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        .container {
            background: var(--card);
            padding: 2rem;
            border-radius: 24px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
            width: 320px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border-radius: 10px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            text-align: center;
            box-sizing: border-box;
            font-size: 1rem;
        }
        .btn {
            background: var(--accent);
            color: #0f172a;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            font-size: 1rem;
            transition: 0.2s;
        }
        .btn:hover { opacity: 0.9; transform: scale(0.98); }
        .board {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-top: 20px;
            display: none;
        }
        .cell {
            aspect-ratio: 1/1;
            background: #334155;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
        }
        .cell:hover { background: #475569; }
        #status {
            margin-bottom: 15px;
            font-weight: bold;
            color: var(--accent);
            min-height: 24px;
        }
        .hidden { display: none; }
        .X { color: #f472b6; }
        .O { color: #38bdf8; }
    </style>
</head>
<body>

<div class="container">
    <h2 id="title">Крестики-Нолики</h2>
    
    <div id="lobby">
        <p>Введите номер комнаты:</p>
        <input type="text" id="room-id" placeholder="Например: 123">
        <button class="btn" onclick="joinRoom()">ИГРАТЬ ПО СЕТИ</button>
        <p style="font-size: 0.8rem; color: #64748b; margin-top: 15px;">Без VPN. На двоих.</p>
    </div>

    <div id="game-area" class="hidden">
        <div id="status">Подключение...</div>
        <div class="board" id="board">
            <div class="cell" onclick="makeMove(0)"></div>
            <div class="cell" onclick="makeMove(1)"></div>
            <div class="cell" onclick="makeMove(2)"></div>
            <div class="cell" onclick="makeMove(3)"></div>
            <div class="cell" onclick="makeMove(4)"></div>
            <div class="cell" onclick="makeMove(5)"></div>
            <div class="cell" onclick="makeMove(6)"></div>
            <div class="cell" onclick="makeMove(7)"></div>
            <div class="cell" onclick="makeMove(8)"></div>
        </div>
        <button class="btn" style="margin-top: 20px; background: #334155; color: white;" onclick="location.reload()">ВЫЙТИ</button>
    </div>
</div>

<script>
    // Твои настройки Firebase
    const firebaseConfig = {
        databaseURL: "https://my-xo-game-21c3b-default-rtdb.firebaseio.com/"
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let roomId, mySymbol, currentTurn, board = Array(9).fill("");
    let gameActive = false;

    function joinRoom() {
        roomId = document.getElementById('room-id').value.trim();
        if(!roomId) return alert("Введите номер комнаты!");
        
        const ref = db.ref('rooms/' + roomId);
        
        ref.once('value').then(snap => {
            const data = snap.val();
            
            if(!data) {
                // Если комнаты нет, создаем и становимся X
                mySymbol = 'X';
                ref.set({
                    board: board,
                    turn: 'X',
                    winner: null
                });
            } else {
                // Если комната есть, становимся O
                mySymbol = 'O';
            }
            
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('game-area').classList.remove('hidden');
            document.getElementById('board').style.display = 'grid';
            gameActive = true;
            listenForMoves();
        });
    }

    function listenForMoves() {
        db.ref('rooms/' + roomId).on('value', snap => {
            const data = snap.val();
            if(!data) return;

            board = data.board;
            currentTurn = data.turn;
            const winner = data.winner;
            
            const cells = document.querySelectorAll('.cell');
            board.forEach((val, i) => {
                cells[i].innerText = val;
                cells[i].className = 'cell ' + (val ? val : '');
            });

            if(winner) {
                document.getElementById('status').innerText = winner === 'Draw' ? "НИЧЬЯ!" : "ПОБЕДА: " + winner;
                gameActive = false;
            } else {
                document.getElementById('status').innerText = (currentTurn === mySymbol) ? "ВАШ ХОД ("+mySymbol+")" : "ХОД СОПЕРНИКА...";
            }
        });
    }

    function makeMove(i) {
        if(!gameActive || board[i] !== "" || currentTurn !== mySymbol) return;

        board[i] = mySymbol;
        const winner = checkWin(board) ? mySymbol : (board.includes("") ? null : 'Draw');
        
        db.ref('rooms/' + roomId).update({
            board: board,
            turn: mySymbol === 'X' ? 'O' : 'X',
            winner: winner
        });
    }

    function checkWin(b) {
        const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
        return lines.some(l => b[l[0]] && b[l[0]] === b[l[1]] && b[l[0]] === b[l[2]]);
    }
</script>
</body>
</html>
